<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Simple Interactive webpage</title>
        <script>
            function changeText() {
                document.getElementById("message").innerHTML = "You have been doxxed, address is Lalor Rd St Postcode: 2405";
            }
        </script>
    </head>
    <body> 
        <h2>Click the button to see what happens:</h2>
        <p id="message">Hello World.</p>
        <button onlick="changeText()">Click me</button>
    </body>
</html>
